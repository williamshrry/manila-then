<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Manila Historical Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      overflow: hidden;
    }

    #map {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .leaflet-container {
      background: #1a1a1a;
    }

    .custom-popup {
      text-align: center;
    }

    .custom-popup img {
      width: 250px;
      border-radius: 10px;
      display: block;
      margin-bottom: 10px;
    }

    .title-bar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 20px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      letter-spacing: 1px;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .legend {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 14px;
      border-radius: 12px;
      width: 220px;
      line-height: 1.5;
      backdrop-filter: blur(10px);
    }

    .legend h3 {
      margin-bottom: 8px;
      font-size: 15px;
    }

    .legend p {
      font-size: 13px;
      opacity: 0.85;
    }

    .marker-label {
      color: white;
      font-size: 12px;
      font-weight: bold;
      text-shadow: 0 0 6px black;
    }
  </style>
</head>
<body>

  <div class="title-bar">
    Interactive Historical Map of Manila
  </div>

  <div id="map"></div>

  <div class="legend">
    <h3>Controls</h3>
    <p>• Scroll to zoom in/out</p>
    <p>• Drag to pan around the map</p>
    <p>• Click the red markers to open image popups</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Create map using a simple coordinate system
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -2,
      maxZoom: 4,
      zoomSnap: 0.1,
    });

    // Dimensions of combined map canvas
    const imageWidth = 2800;
    const imageHeight = 2400;

    const bounds = [[0, 0], [imageHeight, imageWidth]];

    // Add the NORTH map
  L.imageOverlay('./south.jpg', [[0, 0], [1200, 1400]]).addTo(map);
  L.imageOverlay('./north.jpg', [[1200, 0], [2400, 1400]]).addTo(map);

    map.fitBounds(bounds);

        // coordinates

  const coordDisplay = document.createElement('div');

  coordDisplay.style.position = 'absolute';
  coordDisplay.style.bottom = '20px';
  coordDisplay.style.left = '20px';
  coordDisplay.style.zIndex = '1000';
  coordDisplay.style.background = 'rgba(0,0,0,0.75)';
  coordDisplay.style.color = 'white';
  coordDisplay.style.padding = '10px 14px';
  coordDisplay.style.borderRadius = '10px';
  coordDisplay.style.fontFamily = 'Arial';
  coordDisplay.style.fontSize = '14px';
  coordDisplay.style.backdropFilter = 'blur(10px)';
  
  coordDisplay.innerHTML = 'X: 0 | Y: 0';
  
  document.body.appendChild(coordDisplay);
  
  // Update coordinates while moving mouse
  map.on('mousemove', function(e) {
  
    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);
  
    coordDisplay.innerHTML = `X: ${x} | Y: ${y}`;
  });


    // Example clickable marker #1
    const marker1 = L.circleMarker([611, 1374], {
      radius: 8,
      color: '#ff4d4d',
      fillColor: '#ff0000',
      fillOpacity: 1,
      weight: 2
    }).addTo(map);

    marker1.bindPopup(`
      <div class="custom-popup">
        <img src="images/250-solanost.jpg" />
        <strong>250 Solano St</strong><br>
      </div>
    `);


    // Optional coordinate debugging
    map.on('click', function(e) {
      console.log('Clicked at:', e.latlng);
    });

  </script>

</body>
</html>
