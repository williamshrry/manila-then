<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Interactive Historical Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
  }

  #map {
    width: 100vw;
    height: 100vh;
  }

  .legend {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 12px;
    border-radius: 10px;
    z-index: 9999;
    font-size: 13px;
  }

  /* Coordinate box */
  #coords {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 10px 12px;
    border-radius: 10px;
    z-index: 9999;
    font-size: 13px;
  }

  /* Modal */
  #imgModal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 10000;
  }

  #imgModal img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
</style>
</head>

<body>

<div id="map"></div>

<div class="legend">
  <b>Controls</b><br>
  • Scroll = Zoom<br>
  • Drag = Pan<br>
  • Click pins = Open image
</div>

<div id="coords">X: 0 | Y: 0</div>

<!-- FULL SCREEN IMAGE MODAL -->
<div id="imgModal">
  <img id="modalImg">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ---------------- MAP SETUP ----------------
const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 4
});

const bounds = [[0,0],[2400,1400]];

// SOUTH (bottom)
L.imageOverlay('./south.jpg', [[0,0],[1200,1400]]).addTo(map);

// NORTH (top)
L.imageOverlay('./north.jpg', [[1200,0],[2400,1400]]).addTo(map);

map.fitBounds(bounds);

// ---------------- COORDINATES ----------------
const coordBox = document.getElementById("coords");

map.on('mousemove', function(e){
  coordBox.innerHTML =
    "X: " + Math.round(e.latlng.lng) +
    " | Y: " + Math.round(e.latlng.lat);
});

// ---------------- MODAL ----------------
const modal = document.getElementById("imgModal");
const modalImg = document.getElementById("modalImg");

function openImage(src){
  modal.style.display = "flex";
  modalImg.src = src;
}

modal.addEventListener("click", function(){
  modal.style.display = "none";
  modalImg.src = "";
});

// ---------------- PINS ----------------

// Pin 1
L.circleMarker([611, 1374], {
  radius: 7,
  color: "red",
  fillColor: "red",
  fillOpacity: 1
}).addTo(map)
.on('click', () => {
  openImage("images/250-solanost.jpg");
});


</script>

</body>
</html>
